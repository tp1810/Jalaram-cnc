[project]
name = "jalaram-cnc"
version = "1.1.0"
description = "Offline billing system for Jalaram CNC Art & Craft"
readme = "README.md"
authors = [
    { name = "Tarang Patel", email = "tarangp1810@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django==6.0.5",
    "pillow>=12.3.0",
    "python-dotenv>=1.0.0",
    "waitress>=3.0.0",
    "whitenoise>=6.7.0",
]

[project.scripts]
jalaram-cnc = "jalaram_cnc.cli:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
